
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cap d'Antibes 3D Terrain</title>

<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #168aad;
    color: white;
    font-family: Arial, sans-serif;
  }

  #panel {
    position: absolute;
    z-index: 2;
    top: 15px;
    left: 15px;
    padding: 14px;
    background: #172631;
    border-radius: 8px;
    max-width: 300px;
  }

  #exaggeration { width: 150px; }
  #status { font-size: 13px; margin-top: 10px; }
  canvas { display: block; }
</style>
</head>

<body>
<div id="panel">
  <strong>Cap d'Antibes — 3D Terrain</strong>
  <p>
    Vertical exaggeration:
    <span id="exValue">2×</span><br>
    <input id="exaggeration" type="range"
       min="0.5" max="10" step="0.25" value="4">
  </p>
  <div id="status">Loading elevation data…</div>
</div>


<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>    

<script type="module">


import * as THREE from "three";

import { OrbitControls } from
  "three/addons/controls/OrbitControls.js";

import { fromUrl } from
  "https://cdn.jsdelivr.net/npm/geotiff@2.1.4-beta.1/+esm";
    
const scene = new THREE.Scene();
scene.background = new THREE.Color("#168aad");
    
const camera = new THREE.PerspectiveCamera(
  45, innerWidth / innerHeight, 0.1, 10000
);
camera.position.set(90, 85, 110);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x52616b, 2));

const sun = new THREE.DirectionalLight(0xffffff, 2.5);
sun.position.set(-40, 100, 60);
scene.add(sun);

const status = document.querySelector("#status");
const slider = document.querySelector("#exaggeration");
const exValue = document.querySelector("#exValue");

let terrain;
let terrainGeometry;
let terrainMaterial;
let terrainSettings;
let seaPlane;

async function loadTerrain() {
  try {
    status.textContent = "Loading GeoTIFF…";

    // GeoTIFF must be in the same folder as this HTML file.
    const tiff = await fromUrl("./cap_antibes_mapterhorn.tif");
    const image = await tiff.getImage();

    const originalWidth = image.getWidth();
    const originalHeight = image.getHeight();
    const bounds = image.getBoundingBox();

    // Downsample large rasters for browser performance.
    const factor = Math.min(
      1, 500 / Math.max(originalWidth, originalHeight)
    );
    
      const width = 500;
const height = Math.round(
  originalHeight * width / originalWidth
);

const raster = await image.readRasters({
  samples: [0],
  interleave: true,
  width,
  height,
  resampleMethod: "bilinear"
});

console.log("Raster dimensions:", width, height);
console.log("Raster values:", raster.length);
      
    
const noData = image.getGDALNoData();

let min = Infinity;
let max = -Infinity;

for (let i = 0; i < raster.length; i++) {
  const v = Number(raster[i]);

  const isNoData =
    noData !== null &&
    noData !== undefined &&
    v === Number(noData);

  if (Number.isFinite(v) && !isNoData) {
    if (v < min) min = v;
    if (v > max) max = v;
  }
}

if (!Number.isFinite(min) || !Number.isFinite(max)) {
  throw new Error("No valid elevation values.");
}

console.log("Elevation range:", min, max);


    const mapWidth = bounds[2] - bounds[0];
    const mapHeight = bounds[3] - bounds[1];

    if (!(mapWidth > 0 && mapHeight > 0)) {
      throw new Error("Invalid GeoTIFF bounds.");
    }

    const worldWidth = 100;
    const worldDepth = worldWidth * mapHeight / mapWidth;

    terrainSettings = {
      raster, width, height, min, max,
      worldWidth, worldDepth, noData, mapWidth
    };

    buildTerrain(Number(slider.value));

    status.textContent =
      `${width} × ${height} grid | Elevation: ` +
      `${min.toFixed(1)}–${max.toFixed(1)} m`;

  } catch (error) {
    console.error(error);
    status.textContent =
      "Could not load GeoTIFF: " + error.message +
      ". Check the filename and that it is published on GitHub Pages.";
  }
}

function buildTerrain(exaggeration) {
  const {
    raster, width, height, min, max,
    worldWidth, worldDepth, noData, mapWidth
  } = terrainSettings;

  const verticalScale = worldWidth / mapWidth * exaggeration;

  const positions = [];
  const colours = [];
  const indices = [];

const low = new THREE.Color(0xd2b48c); // Tan / Sand
const middle = new THREE.Color(0x397653); // Green further up
const high = new THREE.Color(0xf0eee5);  
const colour = new THREE.Color();


  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      const i = y * width + x;
      const elevation = Number(raster[i]);

      const isValid = Number.isFinite(elevation) &&
        !(noData !== null && noData !== undefined &&
          elevation === Number(noData));

      const zHeight = isValid ? elevation : min;

      positions.push(
        (x / (width - 1) - 0.5) * worldWidth,
        (zHeight - min) * verticalScale,
        (y / (height - 1) - 0.5) * worldDepth
      );

      const t = max > min ? (zHeight - min) / (max - min) : 0;

      if (t < 0.55) {
        colour.copy(low).lerp(middle, t / 0.55);
      } else {
        colour.copy(middle).lerp(high, (t - 0.55) / 0.45);
      }


      colours.push(colour.r, colour.g, colour.b);

      if (x < width - 1 && y < height - 1) {
  const a = i;
  const b = i + 1;
  const c = i + width;
  const d = i + width + 1;

  const validAt = (index) => {
    const v = Number(raster[index]);
    return Number.isFinite(v) &&
      !(noData !== null && noData !== undefined &&
        v === Number(noData));
  };

  if (validAt(a) && validAt(b) && validAt(c)) {
    indices.push(a, c, b);
  }

  if (validAt(b) && validAt(c) && validAt(d)) {
    indices.push(b, c, d);
  }
}
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute(
    "position", new THREE.Float32BufferAttribute(positions, 3)
  );
  geometry.setAttribute(
    "color", new THREE.Float32BufferAttribute(colours, 3)
  );
  geometry.setIndex(indices);
  geometry.computeVertexNormals();

  if (terrain) {
    scene.remove(terrain);
    terrainGeometry.dispose();
    terrainMaterial.dispose();
  }

  terrainGeometry = geometry;
  terrainMaterial = new THREE.MeshStandardMaterial({
  vertexColors: true,
  roughness: 1,
  metalness: 0,
  side: THREE.DoubleSide,
  transparent: true,
  opacity: 1
});

  terrain = new THREE.Mesh(geometry, terrainMaterial);
  scene.add(terrain);

  
  // Mediterranean Sea plane at zero metres elevation
  const seaLevelY = (0 - min) * verticalScale;

  if (!seaPlane) {
    const seaGeometry = new THREE.PlaneGeometry(
      worldWidth * 2.5,
      worldDepth * 2.5
    );

    const seaMaterial = new THREE.MeshStandardMaterial({
      color: 0x168aad,
      roughness: 0.4,
      metalness: 0.05,
      side: THREE.DoubleSide
    });

    seaPlane = new THREE.Mesh(seaGeometry, seaMaterial);

    // Rotate the plane so it lies horizontally in the XZ plane.
    seaPlane.rotation.x = -Math.PI / 2;

    scene.add(seaPlane);
  }

  // Place the water just above the zero-metre elevation.
  seaPlane.position.set(0, seaLevelY + 0.01, 0);


  
  // Automatically frame the terrain in the camera
  const box = new THREE.Box3().setFromObject(terrain);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());

  controls.target.copy(center);

  const maxDimension = Math.max(size.x, size.y, size.z);

// Bring the camera closer to make the terrain appear larger.
const distance = maxDimension * 0.8;

camera.position.set(
  center.x + distance,
  center.y + distance * 0.8,
  center.z + distance
);

  camera.near = 0.1;
  camera.far = distance * 10;
  camera.updateProjectionMatrix();
  controls.update();

}

slider.addEventListener("input", () => {
  exValue.textContent = slider.value + "×";
  if (terrainSettings) buildTerrain(Number(slider.value));
});

loadTerrain();

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
